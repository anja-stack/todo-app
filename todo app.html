<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="style122.css">
</head>
<body>

<div class="container">
    <h1>📋 Task Management System</h1>

    <div class="input-box">
        <input type="text" id="userName" placeholder="Enter User Name">
    </div>

    <div class="input-box">
        <select id="category">
            <option>Study</option>
            <option>Work</option>
            <option>Personal</option>
            <option>Shopping</option>
        </select>
    </div>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter Task">
    </div>

    <div class="input-box">
        <input type="date" id="dueDate">
    </div>

    <div class="input-box">
        <select id="priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>
    </div>

    <div class="input-box">
        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="input-box">
        <input type="text" id="search" placeholder="Search Task..." onkeyup="searchTask()">
    </div>

    <div class="counter">
        <p>Total: <span id="total">0</span></p>
        <p>Completed: <span id="completed">0</span></p>
        <p>Pending: <span id="pending">0</span></p>
    </div>

    <ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
